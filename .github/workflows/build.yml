name: Build and Deploy Icons

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      #   Checkout
      # ----------------------------
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout previous deploy
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: .previous-pages

      # ----------------------------
      #   Setup Python（生成 manifest/index）
      # ----------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # ----------------------------
      #   Cache resvg
      # ----------------------------
      - name: Cache cargo bin
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/resvg
          key: ${{ runner.os }}-resvg
          restore-keys: |
            ${{ runner.os }}-resvg-

      - name: Install resvg if missing
        run: |
          if [ ! -f ~/.cargo/bin/resvg ]; then
            cargo install resvg --locked
          fi

      # ----------------------------
      #   Build assets
      # ----------------------------
      - name: Build assets
        run: |
          set -e

          mkdir -p out/packages
          mkdir -p out/required

          if [ -d .previous-pages ]; then
            rsync -a --exclude='.git' .previous-pages/ out/
          fi

          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          ZERO_SHA="0000000000000000000000000000000000000000"
          DIFF_ARGS=()

          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$ZERO_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            DIFF_ARGS=("$BASE_SHA" "$HEAD_SHA")
          fi

          convert_svg() {
            file="$1"
            out_file="out/${file%.svg}.png"
            mkdir -p "$(dirname "$out_file")"
            echo "Convert $file -> $out_file"
            ~/.cargo/bin/resvg "$file" "$out_file"
          }

          delete_generated_svg_png() {
            file="$1"
            out_file="out/${file%.svg}.png"
            echo "Delete generated output for $file"
            rm -f "$out_file"
          }

          build_package_dir() {
            srcdir="$1"
            pkg=$(basename "$srcdir")
            outdir="out/packages/$pkg"
            mkdir -p "$outdir"

            echo ">> Package: $pkg"

            for file in "$srcdir"/*.png; do
              [ -f "$file" ] || continue
              cp "$file" "$outdir/"
            done
          }

          echo "===== Removing deleted SVG outputs ====="
          if [ ${#DIFF_ARGS[@]} -gt 0 ]; then
            while IFS= read -r -d '' file; do
              delete_generated_svg_png "$file"
            done < <(git diff --no-renames --name-only -z --diff-filter=D "${DIFF_ARGS[@]}" -- ':(glob)packages/**/*.svg')
          fi

          echo "===== Processing packages ====="
          if [ -d packages ]; then
            for dir in packages/*; do
              [ -d "$dir" ] || continue
              build_package_dir "$dir"
            done
          fi

          echo "===== Converting changed SVG files ====="
          if [ ${#DIFF_ARGS[@]} -gt 0 ]; then
            while IFS= read -r -d '' file; do
              [ -f "$file" ] || continue
              convert_svg "$file"
            done < <(git diff --no-renames --name-only -z --diff-filter=AM "${DIFF_ARGS[@]}" -- ':(glob)packages/**/*.svg')
          fi

          echo "===== Converting missing SVG outputs ====="
          if [ -d packages ]; then
            while IFS= read -r -d '' file; do
              out_file="out/${file%.svg}.png"
              [ -f "$out_file" ] && continue
              convert_svg "$file"
            done < <(find packages -type f -name '*.svg' -print0)
          fi

          echo "===== Removing empty package output directories ====="
          find out/packages -type d -empty -delete

          echo "===== Processing required files ====="
          if [ -d required ]; then
            rsync -a --delete required/ out/required/
          fi

      # ----------------------------
      #   Generate index.json
      # ----------------------------
      - name: Generate index
        run: python3 scripts/gen_index.py out

      - name: Generate HTML preview
        run: python3 scripts/gen_html.py out

      # ----------------------------
      #   Add .nojekyll
      # ----------------------------
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # ----------------------------
      #   Deploy to gh-pages
      # ----------------------------
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./out
          token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------
      #   Deploy to Cloudflare Pages
      # ----------------------------
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "colorosicons"
          directory: "./out"
          branch: "main"
